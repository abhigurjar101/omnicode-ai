name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ''
      OMNICODE_DATA_DIR: /tmp/omnicode-test-data
      NEMICODE_DATA_DIR: /tmp/omnicode-test-data
      OMNICODE_VAULT_DIR: /tmp/omnicode-test-vault
      NEMICODE_VAULT_DIR: /tmp/omnicode-test-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/unit tests/integration -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
